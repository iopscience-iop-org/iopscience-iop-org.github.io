<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iopscience.iop.org didn't send any data.</title>
    <link rel="icon" type="image/x-icon" href="https://iopscience.iop.org/Final_Astrophysical_Journal/favicon.ico">
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: #fff;
            color: #202124;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .wrap {
            max-width: 560px;
            width: 100%;
            padding: 60px 24px 24px;
        }
        .icon {
            margin-bottom: 20px;
        }
        .icon svg {
            width: 72px;
            height: 72px;
        }
        h1 {
            font-size: 24px;
            font-weight: 400;
            color: #202124;
            margin: 0 0 8px 0;
            line-height: 1.3;
        }
        .error-code {
            font-size: 13px;
            color: #70757a;
            margin: 0 0 24px 0;
        }
        .desc {
            font-size: 14px;
            color: #5f6368;
            line-height: 1.6;
            margin: 0 0 32px 0;
        }
        details {
            margin-bottom: 32px;
        }
        summary {
            font-size: 13px;
            color: #1a73e8;
            cursor: pointer;
            user-select: none;
            outline: none;
            list-style: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        summary::-webkit-details-marker { display: none; }
        summary::before {
            content: '▶';
            font-size: 9px;
            display: inline-block;
            transition: transform 0.15s;
        }
        details[open] summary::before { transform: rotate(90deg); }
        .detail-list {
            margin: 10px 0 0 0;
            padding: 0 0 0 16px;
            list-style: disc;
            font-size: 13px;
            color: #5f6368;
            line-height: 1.8;
        }
        .actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .btn {
            padding: 9px 20px;
            font-size: 13px;
            border-radius: 4px;
            cursor: pointer;
            border: none;
            font-family: inherit;
            font-weight: 500;
            text-decoration: none;
            display: inline-block;
        }
        .btn-primary {
            background: #1a73e8;
            color: #fff;
        }
        .btn-primary:hover { background: #1765cc; }
        .btn-secondary {
            background: transparent;
            color: #1a73e8;
            border: 1px solid #dadce0;
        }
        .btn-secondary:hover { background: #f8f9fa; }
        @media (prefers-color-scheme: dark) {
            body { background: #202124; }
            h1 { color: #e8eaed; }
            .error-code { color: #9aa0a6; }
            .desc { color: #9aa0a6; }
            .detail-list { color: #9aa0a6; }
            .btn-secondary { color: #8ab4f8; border-color: #3c4043; }
            .btn-secondary:hover { background: #3c4043; }
        }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="icon">
            <!-- Standard "no connection" icon used by browsers -->
            <svg viewBox="0 0 72 72" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="36" cy="36" r="35" stroke="#dadce0" stroke-width="2"/>
                <path d="M36 20C27.163 20 20 27.163 20 36C20 44.837 27.163 52 36 52C44.837 52 52 44.837 52 36C52 27.163 44.837 20 36 20Z" stroke="#9aa0a6" stroke-width="2"/>
                <path d="M20 36H52M36 20C32 26 30 31 30 36C30 41 32 46 36 52M36 20C40 26 42 31 42 36C42 41 40 46 36 52" stroke="#9aa0a6" stroke-width="1.5"/>
                <line x1="18" y1="18" x2="54" y2="54" stroke="#e53935" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
        </div>

        <h1>This site can't be reached</h1>
        <p class="error-code">ERR_CONNECTION_REFUSED</p>

        <p class="desc">
            <strong>iopscience.iop.org</strong> refused to connect.
        </p>

        <details>
            <summary>Try:</summary>
            <ul class="detail-list">
                <li>Checking the connection</li>
                <li>Checking the proxy and the firewall</li>
                <li>Running Windows Network Diagnostics</li>
            </ul>
        </details>

        <div class="actions">
            <button class="btn btn-primary" onclick="window.location.reload()">Reload</button>
            <button class="btn btn-secondary" onclick="history.back()">Go Back</button>
        </div>
    </div>
</body>
</html>
