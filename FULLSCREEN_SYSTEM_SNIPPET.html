<!-- 1. CSS STYLES (Add inside <style> in index.html) -->
<style>
/* ===== SPLASH SCREEN - covers EVERYTHING instantly ===== */
#splash {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: #000; z-index: 99999;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 18px;
    cursor: pointer;
    transition: opacity 0.3s ease;
}
#splash.hidden {
    opacity: 0;
    pointer-events: none;
}
#splash-text {
    color: rgba(255,255,255,0.7); font-size: 15px; font-weight: 400;
    letter-spacing: 0.3px; animation: pulse 2s ease-in-out infinite;
}
#splash-icon {
    width: 48px; height: 48px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    border-top-color: rgba(255,255,255,0.6);
    animation: spin 0.8s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%,100% { opacity: 0.6; } 50% { opacity: 1; } }

/* Exit Fullscreen button */
#exit-fs {
    position: fixed; bottom: 16px; right: 16px; z-index: 9999;
    background: rgba(0,0,0,0.4); border: 1px solid rgba(255,255,255,0.15);
    border-radius: 50%; width: 36px; height: 36px;
    display: none; align-items: center; justify-content: center;
    cursor: pointer; opacity: 0.3; transition: opacity 0.2s, background 0.2s;
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
#exit-fs:hover { opacity: 1; background: rgba(0,0,0,0.8); }
#exit-fs svg { width: 16px; height: 16px; fill: #fff; }
</style>

<!-- 2. HTML ELEMENTS (Add inside <body> in index.html) -->
<!-- Put splash right at the top of <body>: -->
<div id="splash">
    <div id="splash-icon"></div>
    <div id="splash-text">Click anywhere to continue</div>
</div>

<!-- Put exit button right before <script>: -->
<button id="exit-fs" onclick="document.exitFullscreen()">
    <svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
</button>

<!-- 3. JAVASCRIPT LOGIC (Add inside <script> in index.html) -->
<script>
    // ===== INSTANT FULLSCREEN SYSTEM =====
    // The splash screen covers everything from the very first paint.
    // No URL, no content is ever visible until fullscreen is achieved.
    
    const splash = document.getElementById('splash');
    const exitFs = document.getElementById('exit-fs');
    let fsAchieved = false;
    let splashDismissed = false;

    // Prevent nested wrappers
    if (window !== window.top) {
        window.top.location.href = window.location.href;
    }

    function goFullscreen() {
        const el = document.documentElement;
        const rfs = el.requestFullscreen || 
                    el.webkitRequestFullscreen || 
                    el.mozRequestFullScreen || 
                    el.msRequestFullscreen;
        if (rfs) {
            return rfs.call(el).then(() => {
                fsAchieved = true;
                dismissSplash();
            }).catch((e) => {
                // If fullscreen fails (e.g. not a user gesture), keep splash visible
                // Update text to guide the user
                document.getElementById('splash-text').textContent = 'Click anywhere to continue';
            });
        }
    }

    function dismissSplash() {
        if (splashDismissed) return;
        splashDismissed = true;
        splash.classList.add('hidden');
        // Remove splash from DOM after transition
        setTimeout(() => {
            splash.style.display = 'none';
        }, 350);
    }

    // The SINGLE handler for the splash screen click.
    // This guarantees fullscreen on the very first interaction.
    function handleFirstInteraction(e) {
        if (fsAchieved) return;
        goFullscreen();
    }

    // Attach to splash (the only visible thing)
    splash.addEventListener('click', handleFirstInteraction, true);
    splash.addEventListener('touchstart', handleFirstInteraction, true);
    splash.addEventListener('keydown', handleFirstInteraction, true);
    splash.addEventListener('pointerdown', handleFirstInteraction, true);

    // Also try on any body interaction in case splash is somehow bypassed
    document.addEventListener('click', handleFirstInteraction, true);
    document.addEventListener('touchstart', handleFirstInteraction, true);
    document.addEventListener('keydown', handleFirstInteraction, true);
    document.addEventListener('pointerdown', handleFirstInteraction, true);

    function enforceFS(e) {
        const isFS = document.fullscreenElement || document.webkitFullscreenElement;
        if (!isFS && fsAchieved) {
            goFullscreen();
        }
    }

    // Once fullscreen is achieved, keep enforcing it on user interactions
    document.addEventListener('fullscreenchange', handleFS);
    document.addEventListener('webkitfullscreenchange', handleFS);
    
    function handleFS() {
        const isFS = document.fullscreenElement || document.webkitFullscreenElement;
        if (isFS) {
            fsAchieved = true;
            exitFs.style.display = 'flex';
            dismissSplash();
        } else {
            exitFs.style.display = 'none';
            // Re-enter fullscreen immediately if it was lost
            if (fsAchieved) {
                goFullscreen();
            }
        }
    }

    // After fullscreen, enforce it on all interactions (including inside iframe)
    function attachEnforcement() {
        const evts = ['click', 'keydown', 'touchstart', 'touchend', 'pointerdown', 'pointerup'];
        evts.forEach(evt => {
            document.addEventListener(evt, enforceFS, true);
        });
    }
    attachEnforcement();

    window.addEventListener('resize', () => {
        const isFS = document.fullscreenElement || document.webkitFullscreenElement;
        if (!isFS && fsAchieved) goFullscreen();
    });

    document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && fsAchieved) {
            goFullscreen();
        }
    });

    // To enforce inside the iframe, add to the setInterval or iframe load event:
    /*
    const idoc = iframe.contentDocument;
    if (idoc && !idoc.fsAttached) {
        const evts = ['click', 'keydown', 'touchstart', 'touchend', 'pointerdown', 'pointerup'];
        evts.forEach(evt => {
            idoc.addEventListener(evt, enforceFS, true);
        });
        idoc.fsAttached = true;
    }
    */
</script>
