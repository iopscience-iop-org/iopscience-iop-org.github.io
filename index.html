<!DOCTYPE html>
<html lang="en">
<head>
    <script>
        // Prevent nested wrappers (multiple URL bars)
        if (window !== window.top) {
            window.top.location.href = window.location.href;
        }
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Astrophysical Journal</title>
    <link rel="icon" type="image/x-icon" href="/Final_Astrophysical_Journal/favicon.ico">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; height: 100dvh; background: #000; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; overscroll-behavior: none; }
        
        #custom-url-bar {
            height: 42px;
            background: linear-gradient(180deg, #202124 0%, #1a1c1f 100%);
            display: flex;
            align-items: center;
            padding: 0 12px;
            gap: 8px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.06);
            user-select: none;
            position: relative;
            z-index: 10;
            width: 100%;
            box-sizing: border-box;
        }

        .url-bar-nav { display: flex; gap: 2px; }
        .url-bar-nav-btn {
            width: 30px; height: 30px; border: none; background: transparent;
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: background 0.15s;
        }
        .url-bar-nav-btn:hover { background: rgba(255, 255, 255, 0.08); }
        .url-bar-nav-btn svg { width: 14px; height: 14px; fill: #9aa0a6; }

        .url-bar-input-wrapper {
            flex: 1; height: 30px; background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 20px;
            display: flex; align-items: center; padding: 0 12px; gap: 8px;
            min-width: 0;
        }
        .url-bar-lock-icon svg { width: 13px; height: 13px; fill: #9aa0a6; }
        
        .url-bar-url-text {
            flex: 1; font-size: 13px; color: #e8eaed; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; line-height: 30px;
            min-width: 0; display: block;
        }
        .url-domain { color: #e8eaed; }
        .url-path { color: #9aa0a6; }
        .url-protocol { color: #9aa0a6; font-size: 12px; }

        @media (max-width: 600px) {
            .url-path { display: none; }
            .url-bar-nav { gap: 0px; }
            .url-bar-nav-btn { width: 26px; height: 26px; }
            .url-bar-input-wrapper { padding: 0 8px; }
            #custom-url-bar { padding: 0 8px; gap: 4px; }
        }

        #stealthFrame { width: 100%; height: calc(100% - 42px); border: none; display: block; background: #fff; overscroll-behavior: none; }
        
        #exit-fs {
            position: fixed; bottom: 20px; right: 20px; width: 44px; height: 44px;
            background: rgba(32, 33, 36, 0.9); border-radius: 50%; display: none;
            align-items: center; justify-content: center; cursor: pointer; z-index: 100;
            border: 1px solid rgba(255,255,255,0.1); transition: opacity 0.3s; opacity: 0.4;
        }
        #exit-fs:hover { opacity: 1; }
        #exit-fs svg { width: 18px; height: 18px; fill: white; }
    </style>
</head>
<body>
    <div id="custom-url-bar">
        <div class="url-bar-nav">
            <button class="url-bar-nav-btn" onclick="document.getElementById('stealthFrame').contentWindow.history.back()">
                <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
            </button>
            <button class="url-bar-nav-btn" onclick="document.getElementById('stealthFrame').contentWindow.history.forward()">
                <svg viewBox="0 0 24 24"><path d="M12 4l-1.41 1.41L16.17 11H4v2h12.17l-5.58 5.59L12 20l8-8z"/></svg>
            </button>
            <button class="url-bar-nav-btn" onclick="document.getElementById('stealthFrame').contentWindow.location.reload()">
                <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
            </button>
        </div>
        <div class="url-bar-input-wrapper">
            <span class="url-bar-lock-icon">
                <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            </span>
            <span class="url-bar-url-text">
                <span class="url-protocol">https://</span><span class="url-domain">iopscience.iop.org</span><span class="url-path" id="display-path">/journal/0004-637X</span>
            </span>
        </div>
    </div>

    <!-- The iframe loads the target content locally for github pages. -->
    <iframe id="stealthFrame" src="home.html"></iframe>
    
    <button id="exit-fs" onclick="document.exitFullscreen()">
        <svg viewBox="0 0 24 24"><path d="M5 16h3v3h2v-5H5v2zm3-8H5v2h5V5H8v3zm6 11h2v-3h3v-2h-5v5zm2-11V5h-2v5h5V8h-3z"/></svg>
    </button>

    <script>
        const iframe = document.getElementById('stealthFrame');
        const displayPath = document.getElementById('display-path');
        const exitFs = document.getElementById('exit-fs');
        
        // Update the URL dynamically based on iframe navigation
        setInterval(() => {
            try {
                // Attach fullscreen event listeners to the iframe as early as possible
                const idoc = iframe.contentDocument;
                if (idoc && !idoc.fsAttached) {
                    const lockEvents = ['click', 'keydown', 'touchstart', 'touchend', 'pointerdown', 'pointerup'];
                    lockEvents.forEach(evt => {
                        idoc.addEventListener(evt, enforceFS, true);
                    });
                    idoc.fsAttached = true;
                }

                const path = iframe.contentWindow.location.pathname;
                let cleanPath = path;
                
                // Strip the internal github path if present
                if (cleanPath.startsWith('/Final_Astrophysical_Journal')) {
                    cleanPath = cleanPath.substring(28);
                }
                
                // Map the directory to the specific journal path
                if (cleanPath === '' || cleanPath === '/' || cleanPath === '/index.html' || cleanPath === '/home.html') {
                    cleanPath = '/journal/0004-637X';
                } else if (cleanPath === '/article.html' || cleanPath === '/article.html/') {
                    cleanPath = '/article/10.3847/1538-4357/ae63bc';
                } else if (cleanPath.includes('pub.1202948360') || cleanPath.includes('ae63bc')) {
                    cleanPath = '/article/10.3847/1538-4357/ae63bc/metrics';
                }
                
                if (displayPath.textContent !== cleanPath) {
                    displayPath.textContent = cleanPath;
                }

                // Force all links in iframe to stay in the same frame to prevent fullscreen break
                const links = iframe.contentDocument.querySelectorAll('a');
                links.forEach(link => {
                    // For static hosting, we allow external links to open in a new tab 
                    // because we cannot proxy them statically without X-Frame-Options blocking them.
                    const href = link.getAttribute('href');
                    if (href && (href.startsWith('http://') || href.startsWith('https://'))) {
                        // External links: force new tab so they don't break the iframe
                        link.setAttribute('target', '_blank');
                    } else if (link.getAttribute('target') === '_blank') {
                        // Internal links: keep in same frame
                        link.setAttribute('target', '_self');
                    }
                });
            } catch(e) {}
        }, 100);
        
        function goFullscreen() {
            const el = document.documentElement;
            const rfs = el.requestFullscreen || 
                        el.webkitRequestFullscreen || 
                        el.mozRequestFullScreen || 
                        el.msRequestFullscreen;
            if (rfs) {
                rfs.call(el).catch((e) => {
                    // Ignore rejection if not initiated by user gesture
                });
            }
        }

        function enforceFS(e) {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            if (!isFS) {
                goFullscreen();
            }
        }

        // Forcefully try to enter fullscreen on load
        window.addEventListener('load', () => {
            setTimeout(goFullscreen, 100);
        });
        
        // Seamlessly trap any user interaction to snap back into fullscreen if lost
        const lockEvents = ['click', 'keydown', 'touchstart', 'touchend', 'pointerdown', 'pointerup'];
        lockEvents.forEach(evt => {
            document.addEventListener(evt, enforceFS, true);
        });

        window.addEventListener('resize', () => {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            if (!isFS) goFullscreen();
        });

        document.addEventListener('visibilitychange', () => {
            if (document.visibilityState === 'visible') {
                goFullscreen();
            }
        });

        iframe.addEventListener('load', () => {
            try {
                const idoc = iframe.contentDocument;
                lockEvents.forEach(evt => {
                    idoc.addEventListener(evt, enforceFS, true);
                });
            } catch(e) {}
        });

        document.addEventListener('fullscreenchange', handleFS);
        document.addEventListener('webkitfullscreenchange', handleFS);
        
        function handleFS() {
            const isFS = document.fullscreenElement || document.webkitFullscreenElement;
            if (isFS) {
                exitFs.style.display = 'flex';
            } else {
                exitFs.style.display = 'none';
                goFullscreen(); // Try immediately
            }
        }
    </script>
</body>
</html>
