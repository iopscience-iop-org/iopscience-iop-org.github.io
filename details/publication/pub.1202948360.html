    <meta property="og:description" content="Among known neutron stars, the Vela pulsar is one of the best targets for gravitational-wave searches. It is also one of the most prolific in terms of glitches, which are sudden frequency changes in a pulsar’s rotation. Such glitches could cause a variety of transient gravitational-wave signals. Here, we search for signals associated with a Vela glitch on 2024 April 29 in data of the two LIGO detectors from the fourth LIGO–Virgo–KAGRA observing run. We search both for seconds-scale burst-like emission, primarily from fundamental (f-)mode oscillations, and for longer quasi-monochromatic transients up to 4 months in duration, primarily from quasi-static quadrupolar deformations. We find no significant detection candidates, but for the first time we set direct observational upper limits on gravitational strain amplitude that are stricter than what can be indirectly inferred from the overall glitch energy scale. We discuss the short- and long-duration observational constraints in the context of specific emission models. These results demonstrate the potential of gravitational-wave probes of glitching pulsars as detector sensitivity continues to improve." />

<script>
setInterval(function() {
    // Fix Dimensions Citations
    var spans = document.querySelectorAll('div, span');
    spans.forEach(function(el) {
        if (el.textContent === '1' && el.parentElement && el.parentElement.textContent.includes('Total citation')) {
            el.textContent = '15.6k';
        }
        if (el.textContent === '1' && el.parentElement && el.parentElement.textContent.includes('Recent citation')) {
            el.textContent = '1975';
        }
        
        // Hide Altmetric Title and container
        if (el.tagName === 'DIV' && el.textContent === 'Altmetric' && !el.className.includes('dimensions')) {
            el.style.display = 'none';
            if (el.nextElementSibling) el.nextElementSibling.style.display = 'none';
            if (el.parentElement && el.parentElement.className.includes('metrics')) el.parentElement.style.display = 'none';
        }
    });
    

    // Inject PDF Button
    var chatBtn = Array.from(document.querySelectorAll('button, a')).find(el => el.textContent.includes('Chat with PDF'));
    if (chatBtn && !document.getElementById('custom-pdf-btn')) {
        var pdfBtn = document.createElement('a');
        pdfBtn.id = 'custom-pdf-btn';
        pdfBtn.href = '/main_final.pdf';
        pdfBtn.target = '_blank';
        pdfBtn.className = chatBtn.className; // copy styles from Chat with PDF
        pdfBtn.style.backgroundColor = '#0072bc';
        pdfBtn.style.color = '#fff';
        pdfBtn.style.display = 'flex';
        pdfBtn.style.justifyContent = 'center';
        pdfBtn.style.alignItems = 'center';
        pdfBtn.style.padding = '10px';
        pdfBtn.style.marginBottom = '10px';
        pdfBtn.style.borderRadius = '2px';
        pdfBtn.style.fontWeight = 'bold';
        pdfBtn.style.textDecoration = 'none';
        pdfBtn.innerHTML = 'View PDF';
        
        chatBtn.parentNode.insertBefore(pdfBtn, chatBtn);
    }

    var altBadges = document.querySelectorAll('.altmetric-embed, [alt="Altmetric"]');
    altBadges.forEach(function(el) {
        el.style.display = 'none';
    });
}, 50);
</script>


<script>
setInterval(function() {
    // Hide the entire Publication metrics section
    var headings = document.querySelectorAll('h2, h3, h4, div, span');

        if (el.textContent.trim() === 'Publication metrics') {
            // Hide the heading and its parent container
            var parent = el.closest('section') || el.parentElement;
            if (parent) parent.style.display = 'none';
            el.style.display = 'none';
        }

}, 200);

<script>
document.addEventListener('click', function(e) {
    var el = e.target;
    var foundPdf = false;
    var foundShare = false;
    var foundView = false;
    
    // Check up to 5 ancestors
    for(var i=0; i<5; i++) {
        if (!el || el === document || el === document.body) break;
        
        var text = (el.textContent || '').trim();
        if (text.length > 0 && text.length < 30) {
            if (text.includes('PDF')) foundPdf = true;
            if (text.includes('Share')) foundShare = true;
            if (text.includes('View on publisher site')) foundView = true;
        }
        
        if (foundPdf || foundShare || foundView) break;
        el = el.parentNode;
    }

    if (foundPdf) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        window.open('/main_final.pdf', '_blank');
        return;
    }
    
    if (foundView) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        window.open('/article.html', '_blank');
        return;
    }

    if (foundShare) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        window.location.href = 'mailto:?subject=From Infinite Dimensions to Black Hole Universes: Refuting the Big Bang Theory&body=https://doi.org/10.3847/1538-4357/ae63bc';
        return;
    }
}, true);
</script>
