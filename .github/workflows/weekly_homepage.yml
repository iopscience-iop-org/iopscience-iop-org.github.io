name: Weekly Homepage Sync

on:
  schedule:
    - cron: '0 0 * * 0' # Run at midnight every Sunday
  workflow_dispatch: # Allow manual triggering

jobs:
  update-homepage:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install beautifulsoup4 requests
          
      - name: Run Homepage Updater Script
        run: python update_homepage.py
        working-directory: Final_Astrophysical_Journal
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Final_Astrophysical_Journal/index.html
          git add Final_Astrophysical_Journal/home.html
          
          # Only commit if there are changes
          if ! git diff --staged --empty; then
            git commit -m "Automated weekly sync of IOP homepage"
            git push
          else
            echo "No changes detected."
          fi
